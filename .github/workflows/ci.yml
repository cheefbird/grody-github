name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Biome
        uses: biomejs/setup-biome@77af1e9ce0cc32955e83b0c3e30c28ae3b81cab7 # v2.8.0

      - name: Run Biome CI Check
        run: biome ci .

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "3"

      - name: Run tests
        background: true
        run: pnpm test

      - name: Type check
        background: true
        run: pnpm check

      - name: Build Chrome
        background: true
        run: pnpm build

      - name: Build Firefox
        background: true
        run: pnpm build:firefox

      - name: Build Edge
        background: true
        run: pnpm build:edge

      - name: Wait for Checks
        wait-all:
