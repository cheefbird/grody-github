name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Biome
        uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7.1

      - name: Run Biome CI Check
        run: biome ci .

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "3"

      - name: Run tests
        background: true
        run: pnpm test

      - name: Type check
        background: true
        run: pnpm check

      - name: Build Chrome
        background: true
        run: pnpm build

      - name: Build Firefox
        background: true
        run: pnpm build:firefox

      - name: Build Edge
        background: true
        run: pnpm build:edge

      - name: Wait for Checks
        wait-all:
